<div class="min-h-screen bg-gray-50 py-8">
  <div class="max-w-md mx-auto">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">
        📝 Todo App
      </h1>
      <p class="text-gray-600">Angular 18 + Components + Signals</p>
    </div>

    <!-- Add Todo Form -->
    <app-todo-form 
      (todoAdded)="onTodoAdded($event)"
      class="mb-6 block">
    </app-todo-form>

    <!-- Statistics -->
    <div class="bg-white rounded-lg shadow-md p-4 mb-6">
      <div class="grid grid-cols-3 gap-4 text-center">
        <div>
          <div class="text-xl font-bold text-blue-600">
            {{ totalTodos() }}
          </div>
          <div class="text-xs text-gray-600">Total</div>
        </div>
        <div>
          <div class="text-xl font-bold text-green-600">
            {{ completedTodos() }}
          </div>
          <div class="text-xs text-gray-600">Completed</div>
        </div>
        <div>
          <div class="text-xl font-bold text-orange-600">
            {{ pendingTodos() }}
          </div>
          <div class="text-xs text-gray-600">Pending</div>
        </div>
      </div>
    </div>

    <!-- Todo List -->
    <div class="space-y-3">
      @if (todos().length === 0) {
        <!-- Empty State -->
        <div class="bg-white rounded-lg shadow-md p-8 text-center">
          <div class="text-4xl mb-3">📝</div>
          <h3 class="text-lg font-semibold text-gray-700 mb-2">
            No todos yet!
          </h3>
          <p class="text-gray-500">
            Add your first todo above
          </p>
        </div>
      } @else {
        <!-- Todo Items -->
        @for (todo of todos(); track todo.id) {
          <app-todo-item
            [todo]="todo"
            (toggleCompleted)="onToggleTodo($event)"
            (deleteClicked)="onDeleteTodo($event)">
          </app-todo-item>
        }
      }
    </div>

    <!-- Actions -->
    @if (todos().length > 0) {
      <div class="mt-6 flex gap-3">
        <button
          (click)="onClearCompleted()"
          [disabled]="completedTodos() === 0"
          class="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg font-medium
                  hover:bg-red-700 disabled:bg-gray-300 disabled:cursor-not-allowed
                  transition-colors duration-200">
          Clear Completed ({{ completedTodos() }})
        </button>
        <button
          (click)="onClearAll()"
          class="flex-1 px-4 py-2 bg-gray-600 text-white rounded-lg font-medium
                  hover:bg-gray-700 transition-colors duration-200">
          Clear All
        </button>
      </div>
    }
  </div>
</div>
